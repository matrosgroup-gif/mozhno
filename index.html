<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8eee7"><link rel="manifest" href="manifest.webmanifest"><title>МОЖНО — мой мир мечтаний</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5ebe5;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--fg)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{--fg:#513d39;--muted:#907a72;--panel:#fffbf8;--bg:#f8eee7;--accent:#d99586;--edge:#ecd9d0;min-height:100vh;background:var(--bg);transition:.2s}.app.character{--fg:#f1eadb;--muted:#bdc6ba;--panel:#34483d;--bg:#24362e;--accent:#bd9e70;--edge:#53675a}.app.harmony{--fg:#455b4c;--muted:#7e907c;--panel:#fcfdf9;--bg:#eef2e9;--accent:#92a985;--edge:#d8e2d5}.wrap{max-width:1050px;margin:auto}.hero{background:linear-gradient(15deg,#29232cba,#b17f8d33),linear-gradient(120deg,#8c7c8c,#ecc09b 60%,#c47c76);color:white;padding:34px 22px 40px}.hero h1{font-size:38px;letter-spacing:-2px;margin:0}.hero p{margin:10px 0 0;opacity:.93}.main{padding:20px}.nav{display:flex;gap:7px;background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:5px;margin-bottom:17px}.nav button{flex:1;border:0;background:none;color:var(--muted);padding:11px 2px;border-radius:12px;font-weight:650;font-size:13px}.nav button.active{background:var(--bg);color:var(--fg)}.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:19px;padding:20px;margin-bottom:15px}.panel h2{font-size:21px;margin:0 0 7px}.sub{font-size:13px;color:var(--muted);line-height:1.6}.wheel{display:block;width:100%;max-width:470px;margin:12px auto}.sector{cursor:pointer;outline:none}.sector:focus path{stroke:#fdd487;stroke-width:5}.theme-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.pill{border:1px solid var(--edge);background:var(--bg);color:var(--fg);padding:9px 12px;border-radius:30px;font-size:12px}.pill.active,.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary,.secondary{border:1px solid var(--accent);border-radius:13px;padding:13px 17px;font-weight:700}.secondary{background:var(--panel);color:var(--fg);border-color:var(--edge)}.dream{display:block;width:100%;text-align:left;padding:14px;background:var(--bg);border:1px solid var(--edge);border-radius:14px;color:var(--fg);margin-top:9px}.dream strong{display:block}.dream small{color:var(--muted);display:block;margin-top:5px}.label{display:block;font-weight:650;font-size:13px;margin:20px 0 7px}.field{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--edge);border-radius:12px;padding:13px;outline:none}.field:focus{border-color:var(--accent)}.photo{height:190px;border-radius:17px;background-position:center;background-size:cover;display:flex;align-items:end;padding:18px;color:white;font-size:25px;font-weight:750;text-shadow:0 2px 8px #2228}.actions{display:flex;gap:9px;margin-top:18px}.hint{background:var(--bg);padding:14px;border-radius:14px;color:var(--muted);font-size:13px;line-height:1.6}.empty{padding:30px 15px;text-align:center;border:1px dashed var(--edge);border-radius:14px;margin:14px 0}.footer{text-align:center;color:var(--muted);font-size:11px;padding:10px 0 24px}@media(max-width:690px){.grid{grid-template-columns:1fr}.hero{padding:25px 20px}.main{padding:13px}.panel{padding:16px}.wheel{max-width:410px}}
</style></head><body><div id="app" class="app"><header class="hero"><div class="wrap"><h1>можно ✨</h1><p>Мой мир. Мои желания. Моя будущая жизнь.</p></div></header><main class="main wrap"><nav class="nav"><button data-nav="world">Мой мир</button><button data-nav="dreams">Мечты</button><button data-nav="create">+ Помечтать</button></nav><div id="view"></div><div class="footer">Здесь можно мечтать без дедлайнов и обязательств ♡</div></main></div>
<script>
(function(){
'use strict';
var cats=[
{id:'self',name:'Для себя',icon:'♡',color:'#946d80',image:'photo-1470252649378-9c29740c9fa8'},
{id:'health',name:'Здоровье',icon:'✿',color:'#749469',image:'photo-1538805060514-97d9cc17730c'},
{id:'family',name:'Близкие',icon:'♥',color:'#d58b78',image:'photo-1511895426328-dc8714191300'},
{id:'home',name:'Дом и уют',icon:'⌂',color:'#bd9266',image:'photo-1600607687920-4e2a09cf159d'},
{id:'work',name:'Моё дело',icon:'✦',color:'#7189a0',image:'photo-1497366811353-6870744d04b2'},
{id:'money',name:'Деньги',icon:'◈',color:'#ad9458',image:'photo-1486406146926-c627a92ad1ab'},
{id:'travel',name:'Путешествия',icon:'✈',color:'#559bb0',image:'photo-1507525428034-b723cf961d3e'},
{id:'freedom',name:'Свобода',icon:'⌁',color:'#756a7f',image:'photo-1503376780353-7e6692767b70'}];
var key='mozhno-dreams-v1',themeKey='mozhno-theme-v1',data=[],theme='soft',page='world',category='home',opened=null,form={title:'',feeling:'',step:''};
try{data=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(data))data=[];theme=localStorage.getItem(themeKey)||'soft'}catch(e){data=[]}

var startingDreams=[{"id":"seed-porsche","category":"freedom","title":"Мой Porsche 911","feeling":"Наслаждаться дорогой, звуком двигателя, ощущением машины и свободой ехать куда захочется.","step":""},{"id":"seed-dream-house","category":"home","title":"Мой большой дом с красивым видом и бассейном","feeling":"Просыпаться в уютном доме, чувствовать спокойствие, наполненность и радость от того, что это моя жизнь.","step":""},{"id":"seed-morning-together","category":"family","title":"Наше красивое совместное утро","feeling":"Поцеловать жену, вместе приготовить завтрак и никуда не спешить.","step":""},{"id":"seed-zanzibar","category":"travel","title":"Побывать на Занзибаре","feeling":"Океан, тепло, красивые впечатления и возможность просто наслаждаться моментом.","step":""},{"id":"seed-cruise","category":"travel","title":"Отправиться в круиз на корабле","feeling":"Путешествовать, смотреть на новые места и получать удовольствие от дороги.","step":""},{"id":"seed-dubai","category":"family","title":"Отвезти семью в Дубай","feeling":"Разделить с близкими путешествие и яркие впечатления.","step":""},{"id":"seed-drive","category":"freedom","title":"Сесть в Porsche и просто поехать","feeling":"Выбирать направление по настроению, без необходимости всё заранее планировать.","step":""},{"id":"seed-freedom-full","category":"self","title":"Чувствовать себя по-настоящему свободным","feeling":"Разрешать себе хотеть, выбирать и жить в своём ритме.","step":""},{"id":"seed-quiet","category":"self","title":"Быть в тишине и наслаждаться моментом","feeling":"Спокойствие, облегчение и удовольствие от самого момента.","step":""},{"id":"seed-enjoy-myself","category":"self","title":"Получать удовольствие от самого себя","feeling":"Чувствовать наполненность и быть в согласии со своими желаниями.","step":""},{"id":"seed-friends","category":"family","title":"Больше дружбы и живого общения","feeling":"Встречаться с друзьями, делиться впечатлениями и чувствовать близость.","step":""},{"id":"seed-hobbies","category":"self","title":"Найти занятия и увлечения для себя","feeling":"Открывать новое и делать что-то просто потому, что мне интересно.","step":""},{"id":"seed-snowboard","category":"health","title":"Снова кататься на сноуборде","feeling":"Движение, свобода, свежий воздух и радость от любимого занятия.","step":""},{"id":"seed-beauty","category":"self","title":"Окружать себя красивыми вещами и впечатлениями","feeling":"Замечать красоту, позволять себе удовольствие и комфорт.","step":""},{"id":"seed-wife-happy","category":"family","title":"Делать Тамару счастливой","feeling":"Любовь, тепло, нежность и общие счастливые моменты.","step":""},{"id":"seed-travel-more","category":"travel","title":"Больше путешествовать","feeling":"Видеть разные места, открывать мир и собирать живые впечатления.","step":""},{"id":"seed-moscow-home","category":"home","title":"Квартира мечты в красивом доме в Москве","feeling":"Пространство высокого уровня, которое действительно нравится мне.","step":""}];
var seedKey='mozhno-imported-wishes-v1';
try{if(!localStorage.getItem(seedKey)){var known={};data.forEach(function(d){known[d.id]=true});startingDreams.forEach(function(d){if(!known[d.id])data.push(d)});localStorage.setItem(key,JSON.stringify(data));localStorage.setItem(seedKey,'yes')}}catch(e){if(data.length===0)data=startingDreams.slice()}
var root=document.getElementById('app'),view=document.getElementById('view');
function safe(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cat(id){return cats.find(function(c){return c.id===id})||cats[0]}
function picture(c){return 'https://images.unsplash.com/'+c.image+'?auto=format&fit=crop&w=800&q=80'}
function photo(c){return 'linear-gradient(0deg,#25212aab,transparent 72%),url("'+picture(c)+'")'}
function persist(){try{localStorage.setItem(key,JSON.stringify(data));localStorage.setItem(themeKey,theme)}catch(e){}}
function pos(r,a){var t=(a-90)*Math.PI/180;return [200+r*Math.cos(t),200+r*Math.sin(t)]}
function shape(a,b){var p=pos(187,a),q=pos(187,b),r=pos(53,b),s=pos(53,a);return 'M'+p+' A187,187 0 0 1 '+q+' L'+r+' A53,53 0 0 0 '+s+' Z'}
function wheel(){var defs='',sectors='';cats.forEach(function(c,i){var p=shape(i*45+.7,(i+1)*45-.7),xy=pos(120,i*45+22.5),count=data.filter(function(x){return x.category===c.id}).length;defs+='<clipPath id="clip'+i+'"><path d="'+p+'"/></clipPath>';sectors+='<g tabindex="0" role="button" aria-label="'+c.name+'" class="sector" data-sector="'+c.id+'"><path d="'+p+'" fill="'+c.color+'" stroke="#fff4ea" stroke-width="2"/><image href="'+picture(c)+'" width="400" height="400" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip'+i+')" opacity=".90"/><path d="'+p+'" fill="#201623" opacity=".24"/><text x="'+xy[0]+'" y="'+(xy[1]-12)+'" fill="white" font-size="24" text-anchor="middle">'+c.icon+'</text><text x="'+xy[0]+'" y="'+(xy[1]+7)+'" fill="white" font-size="12" stroke="#0006" stroke-width="2" paint-order="stroke" text-anchor="middle" font-weight="700">'+c.name+'</text><text x="'+xy[0]+'" y="'+(xy[1]+23)+'" fill="white" font-size="11" text-anchor="middle">'+(count?count+' мечт':'+')+'</text></g>'});return '<svg class="wheel" viewBox="0 0 400 400" aria-label="Круг сфер жизни"><defs>'+defs+'<radialGradient id="centerGlow"><stop stop-color="#fff6d8"/><stop offset="1" stop-color="#e7a77c"/></radialGradient></defs>'+sectors+'<circle cx="200" cy="200" r="52" fill="#fff9ef"/><circle cx="200" cy="200" r="45" fill="url(#centerGlow)"/><text x="200" y="216" text-anchor="middle" font-size="47" fill="white">♡</text></svg>'}
function item(d){return '<button class="dream" data-open="'+safe(d.id)+'"><strong>'+safe(d.title)+'</strong><small>'+safe(cat(d.category).name)+(d.feeling?' · '+safe(d.feeling):'')+'</small></button>'}
function render(){root.className='app '+theme;document.querySelectorAll('[data-nav]').forEach(function(b){b.classList.toggle('active',b.dataset.nav===page||(page==='sector'&&b.dataset.nav==='world')||(page==='detail'&&b.dataset.nav==='dreams'))});if(page==='world'){view.innerHTML='<div class="grid"><section class="panel"><h2>Моя жизнь — целиком ♡</h2><p class="sub">Прикоснись к сектору, чтобы открыть свои мечты.</p>'+wheel()+'<div class="theme-row"><button class="pill '+(theme==='soft'?'active':'')+'" data-theme="soft">Нежность</button><button class="pill '+(theme==='character'?'active':'')+'" data-theme="character">Характер</button><button class="pill '+(theme==='harmony'?'active':'')+'" data-theme="harmony">Гармония</button></div></section><section class="panel"><h2>Мои мечты ♡</h2><p class="sub">'+(data.length?'Здесь живут твои желания. Возвращайся к ним, когда захочется.':'Твоя будущая жизнь может начаться с одной маленькой мечты.')+'</p>'+(data.length?data.slice().reverse().slice(0,6).map(item).join(''):'<div class="empty">🌅<p>Тебе можно просто хотеть.<br>И не знать пока, как этого достичь.</p></div>')+'<button class="primary" data-go="create" style="width:100%;margin-top:14px">+ Добавить мечту</button><p class="sub">Без процентов, просрочек и оценки себя.</p></section></div>'}
else if(page==='create'){view.innerHTML='<section class="panel"><h2>Давай помечтаем ✨</h2><p class="sub">Можно написать даже пару слов.</p><label class="label">Сфера жизни</label><select class="field" id="category">'+cats.map(function(c){return '<option value="'+c.id+'" '+(c.id===category?'selected':'')+'>'+c.name+'</option>'}).join('')+'</select><div class="photo" style="margin-top:12px;background-image:'+photo(cat(category))+'">'+cat(category).name+'</div><label class="label" for="wish">Чего тебе хочется?</label><textarea class="field" rows="3" id="wish" placeholder="Я просыпаюсь в своём доме...">'+safe(form.title)+'</textarea><label class="label" for="feeling">Что ты почувствуешь, когда мечта сбудется?</label><textarea class="field" rows="2" id="feeling" placeholder="Свободу, тепло, радость...">'+safe(form.feeling)+'</textarea><label class="label" for="step">Маленький шаг (необязательно)</label><input class="field" id="step" value="'+safe(form.step)+'" placeholder="Можно оставить пустым"><div class="actions"><button class="secondary" data-go="world">Назад</button><button class="primary" data-save>♡ Сохранить мечту</button></div></section>'}
else if(page==='sector'){var c=cat(category),items=data.filter(function(d){return d.category===category});view.innerHTML='<div class="photo" style="background-image:'+photo(c)+'">'+c.name+'</div><section class="panel"><h2>Мечты этой сферы</h2>'+(items.length?items.map(item).join(''):'<div class="empty">Здесь пока свободно. Это тоже прекрасно.</div>')+'<div class="actions"><button class="secondary" data-go="world">← К кругу</button><button class="primary" data-go="create">+ Помечтать</button></div></section>'}
else if(page==='dreams'){view.innerHTML='<section class="panel"><h2>Мои мечты ♡</h2>'+(data.length?data.slice().reverse().map(item).join(''):'<div class="empty">Твоей первой мечте уже есть место ♡</div>')+'<button class="primary" data-go="create" style="margin-top:16px">+ Помечтать</button></section>'}
else if(page==='detail'){var d=data.find(function(x){return x.id===opened});if(!d){page='dreams';render();return}view.innerHTML='<div class="photo" style="background-image:'+photo(cat(d.category))+'">'+cat(d.category).name+'</div><section class="panel"><h2>'+safe(d.title)+'</h2>'+(d.feeling?'<div class="hint">♡ '+safe(d.feeling)+'</div>':'')+'<label class="label">Один возможный шаг — если захочется</label><input class="field" id="editstep" value="'+safe(d.step)+'" placeholder="Пока не знаю"><div class="actions"><button class="secondary" data-step>Сохранить мысль</button><button class="secondary" data-go="dreams">Все мечты</button></div><p class="sub">Эта мечта имеет право быть, даже без плана.</p><button class="secondary" data-delete style="margin-top:20px">Удалить мечту</button></section>'}}
function go(p){page=p;render()}
root.addEventListener('input',function(e){if(e.target.id==='wish')form.title=e.target.value;if(e.target.id==='feeling')form.feeling=e.target.value;if(e.target.id==='step')form.step=e.target.value});
root.addEventListener('change',function(e){if(e.target.id==='category'){category=e.target.value;render()}});
root.addEventListener('keydown',function(e){var el=e.target.closest('[data-sector]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();category=el.dataset.sector;go('sector')}});
root.addEventListener('click',function(e){var b=e.target.closest('button,[data-sector]');if(!b)return;
if(b.dataset.sector){category=b.dataset.sector;go('sector')}else if(b.dataset.nav){go(b.dataset.nav)}else if(b.dataset.go){go(b.dataset.go)}else if(b.dataset.theme){theme=b.dataset.theme;persist();render()}else if(b.dataset.open){opened=b.dataset.open;go('detail')}
else if(b.hasAttribute('data-save')){if(!form.title.trim()){document.getElementById('wish').focus();return}data.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),category:category,title:form.title.trim(),feeling:form.feeling.trim(),step:form.step.trim()});form={title:'',feeling:'',step:''};persist();go('world')}
else if(b.hasAttribute('data-step')){var d=data.find(function(x){return x.id===opened});if(d){d.step=document.getElementById('editstep').value;persist();b.textContent='♡ Сохранено'}}
else if(b.hasAttribute('data-delete')){data=data.filter(function(x){return x.id!==opened});persist();go('dreams')}});
render();if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script></body></html>
